services:
  app:
    image: ${ECR_REGISTRY}/codie-backend:${IMAGE_TAG}
    deploy:
      replicas: 2
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVICE_NAME: app
      REDIS_LOCAL: "false"
      PISTON_URL: http://piston:2000
    depends_on:
      - redis
      - worker
      - piston
    networks:
      - backend
    restart: unless-stopped

  scheduler:
    image: ${ECR_REGISTRY}/codie-backend:${IMAGE_TAG}
    command: node dist/bullmq/schedulers/subscriptionScheduler.js
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVICE_NAME: scheduler
      REDIS_LOCAL: "false"
    depends_on:
      - redis
    networks:
      - backend
    restart: unless-stopped

  worker:
    image: ${ECR_REGISTRY}/codie-backend:${IMAGE_TAG}
    command: node dist/bullmq/workers/subscriptionWorker.js
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SERVICE_NAME: worker
      REDIS_LOCAL: "false"
    depends_on:
      - redis
    networks:
      - backend
    restart: unless-stopped

  redis:
    image: redis:alpine
    networks:
      - backend
    restart: unless-stopped

  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    volumes:
      - piston_data:/piston
    expose:
      - "2000"
    networks:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "5000:80"
    depends_on:
      - app
    networks:
      - backend
    restart: unless-stopped

  frontend:
    image: ${ECR_REGISTRY}/codie-frontend:${IMAGE_TAG}
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://app:5000/api
    depends_on:
      - app
    networks:
      - backend
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.0
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - backend
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - loki
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge

volumes:
  piston_data: